name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate API JavaScript syntax
        run: |
          set -e
          shopt -s nullglob
          files=(api/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No api/*.js files found, skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            node --check "$f"
          done

      - name: Audit dependencies (warning only)
        run: npm audit --omit=dev || true
